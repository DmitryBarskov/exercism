name: Elixir CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "elixir/**"
      - ".github/workflows/elixir.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "elixir/**"
      - ".github/workflows/elixir.yml"

permissions:
  contents: read

jobs:
  diff:
    name: Determine changed directories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
    - id: set-matrix
      run: |
        git fetch origin main
        DIRS_JSON=$(git diff --name-only origin/main @ -- elixir/ | sed -E 's|^elixir/([^/]+)/.+|"\1"|' | sort | uniq | jq -sc .)
        echo "exercises=$DIRS_JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: diff

    strategy:
      matrix: ${{ fromJSON(needs.diff.outputs.exercises) }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.4' # [Required] Define the Elixir version
        otp-version: '29.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: "Run tests (elixir/${{ matrix.dirs }}*/)"
      run: |
        for edir in elixir/${{ matrix.dirs }}*/; do
          echo "####################################"
          echo "# Testing '$edir' ... #"
          cd $edir
          mix deps.get
          mix test --include pending
          cd -
          echo "\n"
        done
