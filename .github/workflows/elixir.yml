name: Elixir CI

on:
  push:
    paths:
      - "elixir/**"
      - ".github/workflows/elixir.yml"
  pull_request:
    paths:
      - "elixir/**"
      - ".github/workflows/elixir.yml"

permissions:
  contents: read

jobs:
  diff:
    name: Determine changed directories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          git diff --name-only main @ | sed 's/^elixir\/([^\/]+)\/.+/"\1"/' | sort | uniq | jq -s . >> $GITHUB_OUTPUT

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: diff

    strategy:
      matrix: ${{ fromJSON(needs.diff.output.matrix) }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20.4' # [Required] Define the Elixir version
        otp-version: '29.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: "Run tests (elixir/${{ matrix.dirs }}*/)"
      run: |
        for edir in elixir/${{ matrix.dirs }}*/; do
          echo "####################################"
          echo "# Testing '$edir' ... #"
          cd $edir
          mix deps.get
          mix test --include pending
          cd -
          echo "\n"
        done
